# Provisioning template pinned to the CI-published, attested, and scanned image digest.
# No Git build on Render: CI builds the image; production promotes the tested digest.
services:
  - type: web
    name: specsentry-dev
    runtime: image
    region: singapore
    plan: free
    autoDeployTrigger: off
    image:
      url: ghcr.io/cs3227-2610-mp4-specsentry/cs3227-2610-mp4@sha256:82aca8d1d0193a6496e10a0985f010ec4b132d28d25e33a34e4f58c51142a1da
      creds:
        fromRegistryCreds:
          name: specsentry-ghcr-readyonly
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TRUST_PROXY_HOPS
        value: "1"
  - type: web
    name: specsentry-prod
    runtime: image
    region: singapore
    plan: free
    autoDeployTrigger: off
    image:
      url: ghcr.io/cs3227-2610-mp4-specsentry/cs3227-2610-mp4@sha256:82aca8d1d0193a6496e10a0985f010ec4b132d28d25e33a34e4f58c51142a1da
      creds:
        fromRegistryCreds:
          name: specsentry-ghcr-readyonly
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TRUST_PROXY_HOPS
        value: "1"
